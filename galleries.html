<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Galleries</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            font-family: Arial, sans-serif;
        }

        /* Navbar Styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #222;
            color: white;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .navbar h2 {
            color: #3b5998;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #3b5998;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger span {
            height: 3px;
            width: 25px;
            background: white;
            margin: 4px 0;
            transition: 0.4s;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                background: #111;
                position: absolute;
                top: 60px;
                right: 0;
                width: 200px;
                text-align: right;
                padding: 15px 20px;
            }

            .nav-links.active {
                display: flex;
            }

            .hamburger {
                display: flex;
            }
        }

        h1 {
            color: #3b5998;
            text-align: center;
            margin: 40px 0 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }

        .image, video {
            width: 100%;
            max-width: 280px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(10, 250, 300, 0.3);
            background: black;
        }

        .image {
            padding: 10px;
        }

        video {
            background: #111;
        }
    </style>
</head>
<body>

    <!-- 🔻 Hamburger Navigation Bar -->
    <div class="navbar">
        <h2>Photo Gallery</h2>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="./index.html">Index</a>
            <a href="./home.html">Home</a>
            <a href="./films.html">Films</a>
            <a href="./galleries.html">Galleries</a>
            <a href="./aboutus.html">aboutus</a>
            <a href="./prices.html">Price</a>
            <a href="./signup.html">Price</a>
        </div>
    </div>

    <!-- 💡 Sections -->
    <h1 id="portrait">Portrait Photo Shoot</h1>
    <div class="container">
        <img class="image" src="p1.jpg" alt="">
        <img class="image" src="p2.jpg" alt="">
        <img class="image" src="p3.jpg" alt="">
        <img class="image" src="p4.png" alt="">
    </div>

    <h1 id="prewedding">Pre Wedding Videos & Photo Shoot</h1>
    <div class="container">
        <img class="image" src="pr1.jpeg" alt="">
        <img class="image" src="pr6.jpg" alt="">
        <img class="image" src="pr7.jpg" alt="">
        <img class="image" src="pr2.jpg" alt="">
        <video controls><source src="pr4.mp4" type="video/mp4"></video>
        <video controls><source src="pr5.mp4" type="video/mp4"></video>
        <video controls><source src="pr3.mp4" type="video/mp4"></video>
    </div>

    <h1 id="wedding">Wedding Photoshoot</h1>
    <div class="container">
        <img class="image" src="w1.jpg" alt="">
        <img class="image" src="w2.png" alt="">
        <img class="image" src="w9.jpg" alt="">
        <img class="image" src="w4.avif" alt="">
        <video controls><source src="w5.mp4" type="video/mp4"></video>
        <video controls><source src="w6.mp4" type="video/mp4"></video>
        <video controls><source src="w7.mp4" type="video/mp4"></video>
        <video controls><source src="w8.mp4" type="video/mp4"></video>
    </div>

    <h1 id="babyshower">Baby Shower Photos & Videos</h1>
    <div class="container">
        <img class="image" src="b1.webp" alt="">
        <img class="image" src="b2.jpg" alt="">
        <img class="image" src="b3.jpg" alt="">
        <img class="image" src="b4.jpg" alt="">
        <video controls><source src="b5.mp4" type="video/mp4"></video>
        <video controls><source src="b6.mp4" type="video/mp4"></video>
        <video controls><source src="b7.mp4" type="video/mp4"></video>
    </div>

    <h1 id="concert">Concert Photoshoot & Videography</h1>
    <div class="container">
        <img class="image" src="pa1.jpg" alt="">
        <img class="image" src="pa2.jpg" alt="">
        <img class="image" src="pa3.jpg" alt="">
        <img class="image" src="pa4.jpg" alt="">
        <video controls><source src="pa5.mp4" type="video/mp4"></video>
        <video controls><source src="pa6.mp4" type="video/mp4"></video>
        <video controls><source src="pa7.mp4" type="video/mp4"></video>
    </div>

    <h1 id="candid">Candid Photoshoot</h1>
    <div class="container">
        <img class="image" src="c1.jpg" alt="">
        <img class="image" src="c2.jpg" alt="">
        <img class="image" src="c3.jpg" alt="">
        <img class="image" src="c4.jpg" alt="">
    </div>

    <!-- 🔻 Hamburger Script -->
    <script>
        function toggleMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }
    </script>

</body>
</html>
